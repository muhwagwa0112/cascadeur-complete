name: Unsigned package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned build frontend
        run: python -m pip install uv==0.12.5
      - name: Build development package
        shell: pwsh
        run: ./scripts/build-release.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascadeur-mcp-unsigned-development
          path: |
            artifacts/installer/*.exe
            artifacts/cascadeur-mcp.cdx.json
            artifacts/SHA256SUMS.json
          if-no-files-found: error
          retention-days: 14
