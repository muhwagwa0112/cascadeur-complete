name: Security

on:
  pull_request:
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Export lock and audit dependencies
        shell: pwsh
        run: |
          python -m pip install uv==0.12.5 pip-audit==2.10.1 bandit==1.9.4
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file audit-requirements.txt
          pip-audit --requirement audit-requirements.txt
          bandit -r src packaging -x tests -ll
      - name: Reject committed secrets and release binaries
        shell: pwsh
        run: |
          if (git grep -n -I -E '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AZURE_CLIENT_SECRET|AUTHENTICODE_PASSWORD)' -- ':!*.md') {
            throw 'Possible secret material found'
          }
          $tracked = git ls-files '*.pfx' '*.p12' '*.pem' '*.key' 'artifacts/*'
          if ($tracked) { $tracked; throw 'Forbidden release or key material is tracked' }
